# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
config:
  validation: true

naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  ForbiddenImport:
    active: true
    # Invariant 5: feature UIs (and composeApp) use only the core:designsystem
    # wrappers (Of*), never raw Material3 components. core/designsystem itself is
    # where those wrappers are built, so it is exempt.
    imports:
      - 'androidx.compose.material3.*'
    excludes: ['**/core/designsystem/**']
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/*Test/**', '**/*Test.kt']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
