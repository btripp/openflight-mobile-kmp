name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Lint, Android tests, assemble (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check, test, assemble
        # allTests on Linux has no iOS test tasks to run; exclude them explicitly anyway.
        run: >
          ./gradlew spotlessCheck detekt allTests :androidApp:assembleDebug
          -x iosSimulatorArm64Test

  ios:
    name: iOS tests + Xcode build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test
      - name: Xcode build
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
