# MockServerIT (plan R8g): the app's real data layer against `openflight-server --mock`.
#
# A separate workflow so the path filter is GitHub's own: it runs only when app code, the build or
# this file changes. The main CI workflow (ci.yml) is unchanged and still runs on every push/PR.
#
# Backends are pinned to exact commits so a backend push can't turn this red on its own. To move
# a pin: run the IT locally against the new commit
# (`OPENFLIGHT_BACKEND_DIR=<checkout> ./gradlew mockServerIT`), then update `ref` below.
# - upstream main: open-flight/openflight main at 8d681d0 (2026-10-11; BLE schema 2 from #285).
#   No SSE and no /api/club, so those steps assert the app's Socket.IO fallbacks instead
#   (plan R8j). Every step must pass.
# - phone network stream: btripp/openflight feat/phone-network-stream at 533bcc8, the head of
#   open-flight/openflight#297 (SSE with ?schema=2, /api/club, reconnect catch-up). Every step
#   must pass.
name: Mock server IT

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "feature/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/mock-server-it.yml"
  pull_request:
    # Keep in sync with the push paths above.
    paths:
      - "core/**"
      - "feature/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/mock-server-it.yml"
  workflow_dispatch:

concurrency:
  group: mock-server-it-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-server-it:
    name: MockServerIT vs ${{ matrix.backend.name }} (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: upstream main
            repository: open-flight/openflight
            ref: 8d681d0d96405de83de16c9a1ca4c986fb6a5ffa
          - name: phone network stream (#297)
            repository: btripp/openflight
            ref: 533bcc8744ae931c68e0ee2a9bc6b8dd66cb7349
    steps:
      - uses: actions/checkout@v7
      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.backend.repository }}
          ref: ${{ matrix.backend.ref }}
          path: backend
      # Upstream gitignores uv.lock and has no .python-version, so pin Python here and resolve
      # from pyproject.toml (not --frozen).
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install the backend
        working-directory: backend
        run: uv sync
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: MockServerIT
        env:
          OPENFLIGHT_BACKEND_DIR: ${{ github.workspace }}/backend
        run: ./gradlew :core:data:mockServerIT
