# Versions checked on 2026-09-24 against Maven Central, Google Maven, the Gradle
# plugin portal and the Kotlin/AGP compatibility tables. Gradle wrapper: 9.7.1.
#
# Compatibility notes:
# - Kotlin 2.4.20 is fully supported with Gradle 7.6.3–9.7.x and AGP 8.5.2–9.3.x,
#   so AGP stays on 9.3.x even though 9.4.1 is out (9.4 needs Gradle 9.6 and is not
#   yet in the KGP support table).
# - ADR 0001 (step R1): Android UI is Jetpack Compose, so Compose comes from the Jetpack
#   Compose BOM (2026.09.00 = Compose 1.12.1, material3 1.4.0), not Compose Multiplatform.
#   Shared ViewModels use the KMP `androidx.lifecycle:lifecycle-viewmodel` (2.11.0 publishes
#   iosArm64/iosSimulatorArm64). Versions checked on 2026-09-24 against Google Maven.
# - detekt 2.x is still alpha, so we use 1.23.8 (latest stable).
[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.13.0"
# FileProvider for the CSV share sheet (R5b); the version activity-compose already resolves.
androidx-core = "1.18.0"
androidx-test-runner = "1.7.0"
androidx-test-extJunit = "1.3.0"
# ui-test-junit4 pulls an older Espresso that cannot inject input on API 36+ (no InputManager.getInstance).
androidx-test-espresso = "3.7.0"
assertk = "0.28.1"
datastore = "1.2.1"
detekt = "1.23.8"
kable = "0.45.0"
koin = "4.2.2"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktlint = "1.8.0"
ktor = "3.6.0"
okio = "3.18.2"
spotless = "8.10.2"
turbine = "1.2.1"
androidx-compose-bom = "2026.09.00"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.2"
# iOS interop (ADR 0001, R2): SKIE supports Kotlin only up to 2.4.10; KMP-NativeCoroutines
# 1.0.6 is built for Kotlin 2.4.20 (compiler-plugin mode, no KSP). Keep it in step with the
# Swift package pinned in iosApp.xcodeproj.
kmp-nativecoroutines = "1.0.6"

[libraries]
# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# JUnit 4 binding of kotlin.test for the Android-only modules' JVM unit tests (src/test).
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-extJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
# KMP (commonMain) ViewModel base class for the shared feature ViewModels.
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# Jetpack Compose (Android UI only; versions from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# DI
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-test = { module = "io.insert-koin:koin-test" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

# Transports
kable-core = { module = "com.juul.kable:kable-core", version.ref = "kable" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Build logic (compileOnly in build-logic/convention)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompilerGradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-library = { id = "com.android.library", version.ref = "agp" }
kmp-nativecoroutines = { id = "com.rickclephas.kmp.nativecoroutines", version.ref = "kmp-nativecoroutines" }

# Convention plugins (build-logic/convention)
openflight-kmp-library = { id = "openflight.kmp.library" }
openflight-android-application = { id = "openflight.android.application" }
openflight-spotless = { id = "openflight.spotless" }
openflight-detekt = { id = "openflight.detekt" }
openflight-android-library-compose = { id = "openflight.android.library.compose" }
